<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#6366f1">
    
    <title>LISTA 2026 • Minhas Compras</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="shortcut icon" href="src/img/favicon.ico" type="image/x-icon">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Efeito de vidro no fundo */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 50%, rgba(255,255,255,0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(236,72,153,0.15) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        
        .container {
            position: relative;
            z-index: 1;
            max-width: 550px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 30px 25px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25),
                        0 0 0 1px rgba(255, 255, 255, 0.3) inset;
            animation: slideUp 0.5s ease;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Cabeçalho */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(102, 126, 234, 0.1);
        }
        
        .TITULO {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
            position: relative;
        }
        
        .TITULO::after {
            content: '📋';
            position: absolute;
            right: -40px;
            top: 0;
            font-size: 24px;
            -webkit-text-fill-color: initial;
        }
        
        .logout-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4);
        }
        
        .logout-btn:active {
            transform: translateY(0);
        }
        
        /* Lista */
        #lista {
            list-style: none;
            margin-bottom: 25px;
            max-height: 450px;
            overflow-y: auto;
            padding-right: 5px;
        }
        
        #lista::-webkit-scrollbar {
            width: 6px;
        }
        
        #lista::-webkit-scrollbar-track {
            background: rgba(102, 126, 234, 0.1);
            border-radius: 10px;
        }
        
        #lista::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 10px;
        }
        
        #lista li {
            background: linear-gradient(135deg, #f8f9ff, #ffffff);
            margin-bottom: 12px;
            padding: 18px 20px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02),
                        0 1px 3px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
            animation: fadeIn 0.4s ease;
            position: relative;
            overflow: hidden;
        }
        
        #lista li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(135deg, #667eea, #f093fb);
            border-radius: 4px 0 0 4px;
        }
        
        #lista li:hover {
            transform: translateX(5px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.15);
            border-color: rgba(102, 126, 234, 0.3);
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        #lista li span {
            font-size: 16px;
            font-weight: 500;
            color: #1e1b4b;
            flex: 1;
            padding-right: 15px;
            word-break: break-word;
        }
        
        #lista li button {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 8px 12px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        #lista li button:hover {
            background: #ef4444;
            color: white;
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }
        
        /* Área de adicionar item */
        .add-section {
            margin-top: 20px;
        }
        
        .input-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        #item {
            flex: 1;
            padding: 16px 20px;
            border: 2px solid rgba(102, 126, 234, 0.2);
            border-radius: 50px;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            color: #1e1b4b;
            font-weight: 500;
        }
        
        #item:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
            background: white;
        }
        
        #item::placeholder {
            color: #9ca3af;
            font-weight: 400;
        }
        
        .add-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 16px 28px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.3);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            white-space: nowrap;
            position: relative;
            overflow: hidden;
        }
        
        .add-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.5s, height 0.5s;
        }
        
        .add-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(102, 126, 234, 0.4);
        }
        
        .add-btn:active::before {
            width: 300px;
            height: 300px;
        }
        
        .add-btn:active {
            transform: translateY(-1px);
        }
        
        /* Ícones nos botões */
        .icon {
            width: 18px;
            height: 18px;
            display: inline-block;
            vertical-align: middle;
        }
        
        /* Contador de itens */
        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding: 0 5px;
        }
        
        .stats-text {
            font-size: 14px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .stats-badge {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }
        
        /* Estado vazio */
        .empty-message {
            text-align: center;
            padding: 60px 20px;
            color: #9ca3af;
        }
        
        .empty-message svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        .empty-message h3 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #6b7280;
        }
        
        .empty-message p {
            font-size: 14px;
        }
        
        /* Responsivo */
        @media (max-width: 600px) {
            body {
                padding: 12px;
            }
            
            .container {
                padding: 20px 16px;
                border-radius: 24px;
            }
            
            .TITULO {
                font-size: 22px;
            }
            
            .TITULO::after {
                font-size: 20px;
                right: -35px;
            }
            
            .logout-btn {
                padding: 8px 16px;
                font-size: 13px;
            }
            
            #lista li {
                padding: 14px 16px;
            }
            
            .input-group {
                flex-direction: column;
                gap: 10px;
            }
            
            #item {
                width: 100%;
                padding: 14px 18px;
            }
            
            .add-btn {
                width: 100%;
                padding: 14px;
                text-align: center;
            }
        }
        
        /* Animações de loading */
        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }
        
        .loading-skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 1000px 100%;
            animation: shimmer 2s infinite;
        }
        
        /* Melhorias de acessibilidade */
        button:focus-visible,
        input:focus-visible {
            outline: 3px solid #667eea;
            outline-offset: 2px;
        }
        
        /* Tooltip nos botões */
        [title] {
            position: relative;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Cabeçalho com título e logout -->
        <div class="header">
            <h2 class="TITULO">Minha lista de compras</h2>
            <button onclick="logout()" class="logout-btn" title="Sair da conta">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: inline-block; vertical-align: middle;">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                <span style="margin-left: 6px;">Sair</span>
            </button>
        </div>
        
        <!-- Estatísticas rápidas -->
        <div class="stats">
            <span class="stats-text">Itens na lista</span>
            <span class="stats-badge" id="item-counter">0</span>
        </div>
        
        <!-- Lista de compras -->
        <ul id="lista">
            <!-- Itens serão inseridos aqui pelo JavaScript -->
        </ul>
        
        <!-- Mensagem de lista vazia (escondida por padrão) -->
        <div id="empty-state" class="empty-message" style="display: none;">
            <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="50" cy="50" r="45" stroke-dasharray="8 8" opacity="0.3"/>
                <rect x="35" y="40" width="30" height="4" rx="2" opacity="0.5"/>
                <rect x="40" y="50" width="20" height="4" rx="2" opacity="0.5"/>
                <path d="M70 30 L80 20 L78 18 L68 28" opacity="0.7"/>
                <path d="M30 30 L20 20 L22 18 L32 28" opacity="0.7"/>
            </svg>
            <h3>Lista vazia</h3>
            <p>Adicione itens para começar suas compras</p>
        </div>
        
        <!-- Área de adicionar novo item -->
        <div class="add-section">
            <div class="input-group">
                <input type="text" id="item" placeholder="Digite um novo item..." autocomplete="off">
                <button onclick="AdicionarItem()" class="add-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="display: inline-block; vertical-align: middle; margin-right: 6px;">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Adicionar
                </button>
            </div>
        </div>
    </div>

    <!-- Mantenha seu script original aqui -->
    <script type="module" src="app.js"></script>
    
    <!-- Service Worker (seu código original) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(registration => {
                        console.log('ServiceWorker registrado com sucesso:', registration.scope);
                    })
                    .catch(error => {
                        console.log('Falha ao registrar o ServiceWorker:', error);
                    });
            });
        }
    </script>
    
    <!-- Pequeno script para atualizar contador (não interfere no seu código) -->
    <script>
        (function() {
            // Atualiza o contador de itens sem interferir na sua lógica
            const observer = new MutationObserver(() => {
                const lista = document.getElementById('lista');
                const counter = document.getElementById('item-counter');
                const emptyState = document.getElementById('empty-state');
                
                if (lista && counter) {
                    const items = lista.getElementsByTagName('li');
                    counter.textContent = items.length;
                    
                    if (emptyState) {
                        emptyState.style.display = items.length === 0 ? 'block' : 'none';
                    }
                }
            });
            
            // Observa mudanças na lista
            const lista = document.getElementById('lista');
            if (lista) {
                observer.observe(lista, { childList: true, subtree: true });
            }
            
            // Executa uma vez no início
            setTimeout(() => {
                const items = lista?.getElementsByTagName('li') || [];
                const counter = document.getElementById('item-counter');
                const emptyState = document.getElementById('empty-state');
                if (counter) counter.textContent = items.length;
                if (emptyState) emptyState.style.display = items.length === 0 ? 'block' : 'none';
            }, 100);
        })();
        
        // Permite adicionar com Enter
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('item');
            if (input) {
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        if (typeof AdicionarItem === 'function') {
                            AdicionarItem();
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>
