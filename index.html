<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#0f0f1a">
    
    <title>LISTA 2026 • Minhas Compras</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="shortcut icon" href="src/img/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* ============================================
           LISTA 2026 • Design System - Index
           ============================================ */
        
        :root {
            --color-primary: #6366f1;
            --color-primary-dark: #4f46e5;
            --color-primary-light: #818cf8;
            --color-secondary: #a855f7;
            
            --bg-dark: #0f0f1a;
            --bg-card: rgba(30, 27, 46, 0.7);
            --bg-input: rgba(15, 15, 26, 0.5);
            
            --text-primary: #f1f0fb;
            --text-secondary: #a0a0b8;
            --text-muted: #6b6b80;
            
            --color-success: #10b981;
            --color-warning: #f59e0b;
            --color-error: #ef4444;
            
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-input: rgba(99, 102, 241, 0.2);
            
            --shadow-card: 0 25px 60px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
            --shadow-glow: 0 0 30px rgba(99, 102, 241, 0.2);
            
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-full: 9999px;
            
            --transition-fast: 150ms ease;
            --transition-smooth: 300ms ease;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(145deg, #0a0a14 0%, #12121f 30%, #0f0f1a 60%, #0a0a14 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }
        
        /* Partículas de fundo */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 60%, rgba(99, 102, 241, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(168, 85, 247, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(192, 132, 252, 0.03) 0%, transparent 50%);
            animation: bgFloat 20s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        
        @keyframes bgFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(2%, -2%) scale(1.05); }
            66% { transform: translate(-1%, 1%) scale(0.95); }
        }
        
        .container {
            position: relative;
            z-index: 1;
            max-width: 550px;
            margin: 0 auto;
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: var(--radius-xl);
            padding: 30px 25px;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-subtle);
            animation: slideUp 0.5s ease;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-subtle);
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .header-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, var(--text-primary), var(--color-primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-full);
            background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: white;
        }
        
        .user-email {
            font-size: 13px;
            color: var(--text-secondary);
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: none;
        }
        
        @media (min-width: 480px) {
            .user-email { display: block; }
        }
        
        .logout-btn {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 8px 16px;
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all var(--transition-fast);
            white-space: nowrap;
        }
        
        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.25);
            border-color: rgba(239, 68, 68, 0.5);
        }
        
        /* Status */
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            font-size: 12px;
            color: var(--text-muted);
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--color-success);
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
        }
        
        .status-dot.offline {
            background: var(--color-error);
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.5);
        }
        
        /* Stats */
        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .stats-text {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .stats-badge {
            background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
            color: white;
            padding: 4px 14px;
            border-radius: var(--radius-full);
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        
        /* Lista */
        #lista {
            list-style: none;
            margin-bottom: 20px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
            transition: opacity 0.2s ease;
        }
        
        #lista::-webkit-scrollbar {
            width: 5px;
        }
        
        #lista::-webkit-scrollbar-track {
            background: transparent;
        }
        
        #lista::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.3);
            border-radius: 10px;
        }
        
        .list-item {
            background: rgba(255, 255, 255, 0.03);
            margin-bottom: 10px;
            padding: 16px 18px;
            border-radius: var(--radius-md);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-subtle);
            transition: all var(--transition-smooth);
            animation: fadeIn 0.4s ease both;
            position: relative;
            overflow: hidden;
        }
        
        .list-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(99, 102, 241, 0.3);
            transform: translateX(3px);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .item-name {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
            flex: 1;
            padding-right: 12px;
            word-break: break-word;
            transition: all var(--transition-fast);
        }
        
        .item-name.done {
            text-decoration: line-through;
            opacity: 0.5;
        }
        
        .btn-group {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        
        .toggle-btn {
            width: 34px;
            height: 34px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-subtle);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .toggle-btn:hover {
            background: rgba(245, 158, 11, 0.2);
            border-color: rgba(245, 158, 11, 0.4);
            color: var(--color-warning);
        }
        
        .toggle-btn.done {
            background: rgba(16, 185, 129, 0.2);
            border-color: rgba(16, 185, 129, 0.4);
            color: var(--color-success);
        }
        
        .delete-btn {
            width: 34px;
            height: 34px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-subtle);
            background: rgba(255, 255, 255, 0.03);
            cursor: pointer;
            font-size: 13px;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.4);
            transform: scale(1.1);
        }
        
        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
            text-align: center;
            color: var(--text-muted);
        }
        
        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }
        
        .empty-state h3 {
            font-size: 18px;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }
        
        .empty-state p {
            font-size: 14px;
        }
        
        /* Input Area */
        .add-section {
            margin-top: 5px;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        #item-input {
            flex: 1;
            padding: 15px 18px;
            background: var(--bg-input);
            border: 1.5px solid var(--border-input);
            border-radius: var(--radius-full);
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            color: var(--text-primary);
            transition: all var(--transition-smooth);
            outline: none;
        }
        
        #item-input::placeholder {
            color: var(--text-muted);
        }
        
        #item-input:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
            background: rgba(15, 15, 26, 0.8);
        }
        
        #item-input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        #add-btn {
            background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
            color: white;
            border: none;
            padding: 15px 24px;
            border-radius: var(--radius-full);
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.3);
            transition: all var(--transition-fast);
            white-space: nowrap;
            position: relative;
            overflow: hidden;
        }
        
        #add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(99, 102, 241, 0.45);
        }
        
        #add-btn:active {
            transform: translateY(0);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        
        #add-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        /* Toast Notification */
        .toast-notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--color-error);
            color: white;
            padding: 12px 24px;
            border-radius: var(--radius-full);
            font-size: 14px;
            font-weight: 600;
            z-index: 1000;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }
        
        /* Shake animation */
        @keyframes shakeError {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
        
        /* Responsivo */
        @media (max-width: 480px) {
            body { padding: 10px; }
            .container { padding: 20px 15px; border-radius: var(--radius-lg); }
            .header-title { font-size: 18px; }
            .input-group { flex-direction: column; }
            #item-input { width: 100%; }
            #add-btn { width: 100%; text-align: center; justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <div class="logo-icon">📋</div>
                <h1 class="header-title">Minha Lista</h1>
            </div>
            <div class="header-right">
                <div class="user-info">
                    <div class="avatar" id="userAvatar">?</div>
                    <span class="user-email" id="userEmailDisplay"></span>
                </div>
                <button class="logout-btn" id="logout-btn">Sair</button>
            </div>
        </div>
        
        <!-- Status -->
        <div class="status-indicator">
            <span class="status-dot"></span>
            <span class="status-text">Online</span>
        </div>
        
        <!-- Contador -->
        <div class="stats">
            <span class="stats-text">Itens na lista</span>
            <span class="stats-badge" id="item-counter">0</span>
        </div>
        
        <!-- Lista de Compras -->
        <ul id="lista"></ul>
        
        <!-- Estado Vazio -->
        <div id="empty-state" class="empty-state" style="display: none;">
            <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="50" cy="50" r="45" stroke-dasharray="8 8" opacity="0.3"/>
                <rect x="35" y="40" width="30" height="4" rx="2" opacity="0.4"/>
                <rect x="40" y="50" width="20" height="4" rx="2" opacity="0.4"/>
            </svg>
            <h3>Lista vazia</h3>
            <p>Adicione itens para começar suas compras</p>
        </div>
        
        <!-- Input de Adição -->
        <div class="add-section">
            <div class="input-group">
                <input 
                    type="text" 
                    id="item-input" 
                    placeholder="Digite um novo item..." 
                    autocomplete="off"
                    aria-label="Novo item"
                >
                <button id="add-btn">
                    + Adicionar
                </button>
            </div>
        </div>
    </div>
    
    <!-- Script Principal -->
    <script type="module" src="app.js"></script>
    
    <!-- Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(reg => console.log('SW registrado:', reg.scope))
                    .catch(err => console.log('SW falhou:', err));
            });
        }
    </script>
</body>
</html>
